server.port=${PORT:8092}

# Local default: H2. Production: set DATABASE_URL, DATABASE_USERNAME and DATABASE_PASSWORD.
# For Neon, DATABASE_URL should be a JDBC PostgreSQL URL, for example:
# jdbc:postgresql://ep-example.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:votingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Keep the connection pool small for the Neon Free plan and an EC2-hosted application.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
